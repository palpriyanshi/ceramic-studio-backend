/api/v1/orders:
  post:
    summary: Place a new order
    tags: [User - Orders]
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [items, shippingAddress, payment]
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    product:  { type: string }
                    quantity: { type: integer }
              shippingAddress:
                type: object
                properties:
                  fullName:   { type: string }
                  phone:      { type: string }
                  street:     { type: string }
                  city:       { type: string }
                  postalCode: { type: string }
                  country:    { type: string }
              payment:
                type: object
                properties:
                  method: { type: string, enum: [razorpay, cod, card] }
              shippingCharge: { type: number, default: 0 }
              discount:       { type: number, default: 0 }
    responses:
      201:
        description: Order placed
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      400:
        description: Validation error or insufficient stock
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

/api/v1/orders/my:
  get:
    summary: Get own orders
    tags: [User - Orders]
    security:
      - cookieAuth: []
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 10 }
      - in: query
        name: status
        schema: { type: string }
    responses:
      200:
        description: Paginated order list

/api/v1/orders/my/{id}:
  get:
    summary: Get a specific own order
    tags: [User - Orders]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      200:
        description: Order detail
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      404:
        description: Order not found
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

/api/v1/orders/my/{id}/cancel:
  patch:
    summary: Cancel own order (pending or confirmed only)
    tags: [User - Orders]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason: { type: string }
    responses:
      200:
        description: Order cancelled
      400:
        description: Cannot cancel at this stage
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

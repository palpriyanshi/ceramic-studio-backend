/api/v1/admin/orders:
  get:
    summary: Get all orders
    tags: [Admin - Orders]
    security:
      - cookieAuth: []
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 20 }
      - in: query
        name: status
        schema: { type: string }
      - in: query
        name: userId
        schema: { type: string }
    responses:
      200:
        description: Paginated order list with user info

/api/v1/admin/orders/{id}:
  get:
    summary: Get any order by ID
    tags: [Admin - Orders]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      200:
        description: Order detail with user and product info
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      404:
        description: Order not found
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
  delete:
    summary: Delete an order
    tags: [Admin - Orders]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      200:
        description: Order deleted

/api/v1/admin/orders/{id}/status:
  patch:
    summary: Update order status
    tags: [Admin - Orders]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [pending, confirmed, processing, shipped, delivered, cancelled, refunded]
              reason: { type: string }
    responses:
      200:
        description: Status updated
      400:
        description: Invalid status
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

/api/v1/admin/users:
  get:
    summary: Get all users
    tags: [Admin - Users]
    security:
      - cookieAuth: []
    parameters:
      - in: query
        name: page
        schema: { type: integer, default: 1 }
      - in: query
        name: limit
        schema: { type: integer, default: 20 }
      - in: query
        name: role
        schema: { type: string, enum: [user, admin] }
      - in: query
        name: search
        schema: { type: string }
    responses:
      200:
        description: Paginated user list
      403:
        description: Admins only
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }

/api/v1/admin/users/{id}:
  get:
    summary: Get a user by ID
    tags: [Admin - Users]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      200:
        description: User detail
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      404:
        description: User not found
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
  patch:
    summary: Update a user's name / email / role
    tags: [Admin - Users]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:  { type: string }
              email: { type: string }
              role:  { type: string, enum: [user, admin] }
    responses:
      200:
        description: Updated user
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
  delete:
    summary: Delete a user
    tags: [Admin - Users]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    responses:
      200:
        description: User deleted
      400:
        description: Cannot delete own account
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiError' }
